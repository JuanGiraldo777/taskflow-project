<!--
  @file ejercicio_web/catalogo.html
  @description Página de catálogo/resultados — misma cabecera/carrito/
  wishlist/filtros que index.html, adaptado para mostrar todo el catálogo
  en vez de una sección fija del home. Entiende tres formas de llegar acá,
  combinables entre sí: búsqueda por texto (?q=), navegación por categoría/
  sexo desde el menú lateral (?category=/?gender=), y el panel de filtros
  de precio/marca/orden — ver js/pages/catalogo.js.
-->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo — Maison Eternelle Perfumería</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/imgs/M_DORADA.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/imgs/M_DORADA.png"
    />

    <!-- Optimización fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Estilos -->
    <link rel="stylesheet" href="src/output.css" />

    <!--
      El header (.top-bar) es position:absolute, así que no empuja el
      contenido — cada sección debe darse su propio padding-top para no
      quedar tapada/difuminada bajo él. Su altura real cambia por
      breakpoint (70px <640px, 200px entre 640-767px, 190px desde 768px),
      así que en vez de adivinar una clase arbitraria de Tailwind (que
      además puede no estar compilada en output.css, ver nota en
      style.css), se fija en CSS plano con margen de sobra.
    -->
    <style>
      .catalog-section {
        padding-top: 230px;
      }
      @media (max-width: 639px) {
        .catalog-section {
          padding-top: 100px;
        }
      }

      /*
        El panel de filtros no tenía tope de alto en desktop (solo en
        max-sm, y esa clase tampoco estaba compilada — mismo problema de
        arriba) así que en pantallas bajas se salía del viewport sin
        ningún margen. Con esto el panel nunca mide más que el alto
        disponible: si el contenido no entra, hace scroll interno.
      */
      .filter-panel-scroll {
        max-height: calc(100vh - 180px);
        overflow-y: auto;
      }
      @media (max-width: 639px) {
        .filter-panel-scroll {
          max-height: calc(100vh - 150px);
        }
      }
    </style>
  </head>

  <body>
    <!-- OVERLAY -->
    <div class="overlay fixed inset-0 bg-black/45 z-[250]" id="overlay"></div>

    <!-- CART OVERLAY -->
    <div
      class="cart-overlay fixed inset-0 bg-black/40 z-[350] hidden"
      id="cart-overlay"
    ></div>

    <!-- CART DRAWER -->
    <aside
      class="cart-drawer fixed top-0 right-0 h-screen w-[420px] max-sm:w-full bg-(--bg) z-[360] translate-x-full transition-transform duration-300 ease-out flex flex-col"
      id="cart-drawer"
    >
      <div
        class="flex items-center justify-between p-6 border-b border-gray-700 bg-(--card-bg)"
      >
        <h2 class="font-serif text-(--text) text-xl tracking-wide">
          Tu Carrito
        </h2>
        <button
          id="close-cart-btn"
          class="text-gray-400 hover:text-(--accent) transition-colors p-1"
          aria-label="Cerrar carrito"
        >
          <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M19.35 6.04C18.67 5.36 17.55 5.36 16.87 6.04L12 10.91 7.13 6.04c-.67-.68-1.79-.68-2.47 0-.68.67-.68 1.79 0 2.47L9.53 12l-4.87 4.87c-.68.68-.68 1.79 0 2.47.67.68 1.79.68 2.47 0L12 13.09l4.87 4.87c.67.68 1.79.68 2.47 0 .68-.68.68-1.79 0-2.47L14.47 12l4.88-4.96c.68-.68.68-1.81 0-2.47z"
            />
          </svg>
        </button>
      </div>

      <div id="cart-items" class="flex-1 overflow-y-auto px-2 py-4 space-y-px">
        <!-- Aquí se renderizan dinámicamente los productos -->
      </div>

      <div id="cart-footer" class="bg-(--card-bg)">
        <!-- Aquí se renderizan el total y botones de acción -->
      </div>
    </aside>

    <!-- SIDE MENU -->
    <aside
      class="side-menu fixed top-0 left-0 w-[280px] h-screen bg-(--bg) z-[300] pt-[140px] px-8"
      id="sideMenu"
    >
      <nav>
        <ul class="list-none">
          <li class="mb-7">
            <a
              href="catalogo.html"
              class="no-underline text-(--text) font-serif text-[22px] tracking-wide"
              >Ver Todos</a
            >
          </li>
          <li class="mb-7">
            <a
              href="catalogo.html?type=original"
              class="no-underline text-(--text) font-serif text-[22px] tracking-wide"
              >Originales</a
            >
          </li>
          <li class="mb-7">
            <a
              href="catalogo.html?type=preparado"
              class="no-underline text-(--text) font-serif text-[22px] tracking-wide"
              >Preparados</a
            >
          </li>
          <li class="mb-7">
            <a
              href="catalogo.html?gender=caballero"
              class="no-underline text-(--text) font-serif text-[22px] tracking-wide"
              >Caballero</a
            >
          </li>
          <li class="mb-7">
            <a
              href="catalogo.html?gender=dama"
              class="no-underline text-(--text) font-serif text-[22px] tracking-wide"
              >Dama</a
            >
          </li>
          <li class="mb-7">
            <a
              href="catalogo.html?category=disenador"
              class="no-underline text-(--text) font-serif text-[22px] tracking-wide"
              >Diseñador</a
            >
          </li>
          <li class="mb-7">
            <a
              href="catalogo.html?gender=unisex"
              class="no-underline text-(--text) font-serif text-[22px] tracking-wide"
              >Unisex</a
            >
          </li>
          <li class="mb-7">
            <a
              href="catalogo.html?category=arabe"
              class="no-underline text-(--text) font-serif text-[22px] tracking-wide"
              >Arabe</a
            >
          </li>
          <li class="mb-7">
            <a
              href="catalogo.html?category=nicho"
              class="no-underline text-(--text) font-serif text-[22px] tracking-wide"
              >Nicho</a
            >
          </li>
        </ul>
      </nav>
    </aside>

    <header
      class="top-bar absolute top-0 left-0 w-full h-[200px] max-sm:h-[70px] md:h-[190px] z-10 backdrop-blur-md bg-(--bg)/20"
    >
      <div
        class="max-w-[1400px] mx-auto h-full grid grid-cols-[1fr_auto_1fr] max-sm:grid-cols-[auto_1fr_auto] md:grid-cols-[1fr_auto_1fr] items-center px-12 max-sm:px-4 md:px-8 max-sm:gap-2 md:gap-6 text-(--primary-text)"
      >
        <!--IZQUIERDA-->
        <div
          class="justify-self-start flex items-center gap-8 max-sm:gap-3 md:gap-5"
        >
          <button
            id="darkModeToggle"
            class="mode-toggle flex items-center justify-center gap-2 text-[10px] px-[18px] py-[10px] max-sm:px-3 max-sm:py-2 max-sm:text-[8px] md:px-4 md:py-2 md:text-[9px] bg-(--bg) text-(--accent) border-none rounded-[30px] cursor-pointer shadow-[0_4px_12px_rgba(0,0,0,0.3)] transition-all duration-200 hover:scale-105 hover:shadow-[0_6px_16px_rgba(0,0,0,0.4)] active:scale-95"
            aria-label="Cambiar modo"
          >
            🌙 | ☀️
          </button>
          <button
            class="threebars w-[26px] h-[18px] flex flex-col justify-between bg-transparent border-none cursor-pointer p-0"
            id="threebars"
            aria-label="Seccion de despliegue de categorias"
          >
            <span></span> <span></span> <span></span>
          </button>
          <button
            id="filter-btn"
            class="filter-btn bg-transparent border-none cursor-pointer p-0 min-w-8 min-h-8"
            aria-label="Abrir panel de filtros"
          >
            <svg
              class="stroke-(--bg) cursor-pointer opacity-85 hover:opacity-100 hover:-translate-y-px transition-all duration-200 max-sm:w-6 max-sm:h-6"
              width="30"
              height="30"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
              />
            </svg>
          </button>
        </div>

        <!-- CENTRO -->
        <div class="justify-self-center">
          <a href="index.html">
            <img
              id="main-logo"
              src="assets/imgs/LOGO_PRINCIPAL_NEGRO.png"
              alt="Logo Perfumeria"
              class="h-[200px] max-sm:h-[60px] md:h-[140px] block"
            />
          </a>
        </div>

        <!-- DERECHA -->
        <div
          class="justify-self-end flex items-center gap-[26px] max-sm:gap-3 md:gap-5 font-sans text-sm max-sm:text-xs md:text-sm tracking-wide"
        >
          <div
            class="search-container relative hidden sm:flex md:flex items-center gap-3 pb-1 cursor-text hover:border-b hover:border-(--accent)"
          >
            <svg
              class="stroke-(--bg) cursor-pointer opacity-85 hover:opacity-100 hover:-translate-y-px transition-all duration-200 max-sm:w-6 max-sm:h-6 md:w-7 md:h-7"
              width="30"
              height="30"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
              />
            </svg>
            <input
              type="text"
              id="search"
              placeholder="Buscar perfume"
              class="text-white bg-transparent opacity-90 text-[15px] max-sm:text-xs md:text-sm tracking-wide border-none outline-none focus:opacity-100 transition-opacity duration-200"
            />

            <!-- SEARCH DROPDOWN -->
            <div
              id="search-dropdown"
              class="hidden absolute top-[100%] left-0 right-0 max-w-[300px] bg-(--card-bg) border border-(--accent) border-opacity-30 rounded-lg shadow-lg z-40 mt-2 backdrop-blur-sm bg-opacity-95"
            >
              <!-- Contenido dinámico: tendencias o resultados -->
            </div>
          </div>

          <div>
            <button
              id="user-profile-btn"
              class="bg-transparent border-none cursor-pointer p-0 min-w-8 min-h-8"
              aria-label="Abrir perfil de usuario"
            >
              <svg
                class="stroke-(--bg) cursor-pointer opacity-85 hover:opacity-100 hover:-translate-y-px transition-all duration-200 max-sm:w-6 max-sm:h-6 md:w-7 md:h-7"
                width="30"
                height="30"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                />
              </svg>
            </button>
          </div>

          <div class="relative">
            <div class="cart-icon cursor-pointer relative min-w-8 min-h-8">
              <svg
                class="stroke-(--bg) cursor-pointer opacity-85 hover:opacity-100 hover:-translate-y-px transition-all duration-200 max-sm:w-6 max-sm:h-6 md:w-7 md:h-7"
                width="30"
                height="30"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"
                />
              </svg>
              <span
                class="cart-count absolute -top-2 -right-2 bg-(--accent) text-black text-xs max-sm:text-[10px] rounded-full w-5 h-5 max-sm:w-4 max-sm:h-4 flex items-center justify-center font-bold"
                >0</span
              >
            </div>
          </div>

          <div class="relative">
            <div class="wishlist-icon cursor-pointer relative min-w-8 min-h-8">
              <svg
                class="stroke-(--bg) cursor-pointer opacity-85 hover:opacity-100 hover:-translate-y-px transition-all duration-200 max-sm:w-6 max-sm:h-6 md:w-7 md:h-7"
                width="30"
                height="30"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
                />
              </svg>
              <span
                class="wishlist-count absolute -top-2 -right-2 bg-(--accent) text-black text-xs max-sm:text-[10px] rounded-full w-5 h-5 max-sm:w-4 max-sm:h-4 flex items-center justify-center font-bold"
                >0</span
              >
            </div>
            <div
              class="icon-wishlist-container hidden absolute top-[40px] right-0 max-sm:left-0 max-sm:right-0 max-sm:fixed max-sm:top-auto bg-(--card-bg) border-2 border-(--accent) p-[10px] w-64 max-sm:w-screen z-50"
            >
              <!-- Aquí se renderizan dinámicamente los productos de la wishlist -->
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- PANEL DE FILTROS -->
    <div
      id="filter-panel"
      class="filter-panel-scroll hidden fixed top-[150px] max-sm:top-[120px] left-[80px] max-sm:left-0 max-sm:right-0 max-sm:w-screen max-sm:max-w-[280px] max-sm:mx-auto bg-(--card-bg) border border-(--accent) rounded-lg max-sm:rounded-none shadow-lg z-[200] p-6 max-sm:p-4 w-[280px]"
    >
      <h3 class="font-serif text-lg text-(--text) mb-6 tracking-wide">
        FILTROS
      </h3>

      <div class="mb-6">
        <label class="block text-sm text-(--text) font-serif mb-3 font-bold">
          Rango de Precio
        </label>
        <div class="flex gap-2 items-center">
          <input
            id="min-price"
            type="number"
            placeholder="Min $0"
            class="w-1/2 px-2 py-2 max-sm:py-3 bg-(--bg) text-(--text) border border-(--text) rounded text-xs max-sm:text-sm focus:outline-none focus:border-(--accent)"
          />
          <span class="text-(--text) text-xs">-</span>
          <input
            id="max-price"
            type="number"
            placeholder="Max $999999"
            class="w-1/2 px-2 py-2 max-sm:py-3 bg-(--bg) text-(--text) border border-(--text) rounded text-xs max-sm:text-sm focus:outline-none focus:border-(--accent)"
          />
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm text-(--text) font-serif mb-3 font-bold">
          Marca
        </label>
        <div
          id="brand-filter-list"
          class="space-y-2"
          style="max-height: 12rem; overflow-y: auto; padding-right: 4px"
        >
          <!-- Se llena dinámicamente con las marcas reales (filters.js) -->
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm text-(--text) font-serif mb-3 font-bold">
          Ordenar por
        </label>
        <select
          id="sort-select"
          class="w-full px-3 py-2 max-sm:py-3 max-sm:text-sm bg-(--bg) text-(--text) border border-(--text) rounded text-xs focus:outline-none focus:border-(--accent)"
        >
          <option value="">Sin ordenar</option>
          <option value="price-asc">Menor a Mayor</option>
          <option value="price-desc">Mayor a Menor</option>
          <option value="name-asc">A → Z</option>
          <option value="name-desc">Z → A</option>
        </select>
      </div>

      <!-- Botón Ver Resultados: navega a catalogo.html con estos filtros
           aplicados, igual que la barra de búsqueda navega con ?q= -->
      <button
        id="apply-filters-btn"
        class="w-full mb-3 px-4 py-2 max-sm:py-3 bg-(--accent) text-black font-serif font-bold text-sm max-sm:text-base rounded transition-all duration-200 hover:opacity-90 active:scale-95"
      >
        Ver Resultados
      </button>

      <button
        id="clear-filters"
        class="w-full px-4 py-2 max-sm:py-3 bg-transparent border border-(--accent) text-(--accent) font-serif font-bold text-sm max-sm:text-base rounded transition-all duration-200 hover:bg-(--accent) hover:text-black active:scale-95"
      >
        Limpiar Filtros
      </button>
    </div>

    <main>
      <!-- CATÁLOGO / RESULTADOS — el título y el resumen los arma
           catalogo.js según cómo se haya llegado (búsqueda, categoría/
           sexo del menú, filtros, o el catálogo completo). -->
      <section
        class="catalog-section bg-(--bg) pb-[100px] max-sm:pb-12 md:pb-16 px-20 max-sm:px-4 sm:px-8 md:px-12 text-center min-h-screen"
      >
        <a
          href="index.html"
          class="inline-flex items-center gap-2 text-(--text) opacity-70 hover:opacity-100 hover:text-(--accent) transition-all font-sans text-sm mb-8"
        >
          ← Volver al inicio
        </a>

        <h1
          id="catalog-heading"
          class="font-serif tracking-[3px] text-[32px] max-sm:text-2xl md:text-[32px] text-(--text) mb-3"
        >
          CATÁLOGO COMPLETO
        </h1>
        <p
          id="search-results-summary"
          class="text-(--text) opacity-60 font-sans text-sm mb-12 max-sm:mb-8"
        >
        </p>

        <!-- Selector de sexo: solo se muestra navegando por categoría
             (Árabe/Nicho/Diseñador — ahí se mezclan dama/caballero/unisex
             y conviene poder acotar sin salir de la categoría). Lo arma
             catalogo.js; en el resto de las vistas queda oculto. -->
        <div
          id="category-gender-tabs"
          class="hidden flex justify-center gap-4 max-sm:gap-2 flex-wrap mb-10 text-sm"
        >
          <button
            class="category-gender-tab active font-bold text-(--text) bg-transparent border-none cursor-pointer font-serif"
            data-gender=""
          >
            Todos
          </button>
          <span>/</span>
          <button
            class="category-gender-tab text-(--text) bg-transparent border-none cursor-pointer font-serif"
            data-gender="caballero"
          >
            Caballero
          </button>
          <span>/</span>
          <button
            class="category-gender-tab text-(--text) bg-transparent border-none cursor-pointer font-serif"
            data-gender="dama"
          >
            Dama
          </button>
          <span>/</span>
          <button
            class="category-gender-tab text-(--text) bg-transparent border-none cursor-pointer font-serif"
            data-gender="unisex"
          >
            Unisex
          </button>
        </div>

        <!-- GRID — mismo id que Destacados: reutiliza fetchProducts, el
             panel de filtros y el estado vacío tal cual, sin duplicar nada. -->
        <div
          id="products-grid"
          class="grid grid-cols-4 gap-8 max-lg:grid-cols-2 max-lg:gap-6 max-sm:grid-cols-1 max-sm:gap-4 md:gap-8 text-left"
        >
          <!-- Las tarjetas de resultados se generan dinámicamente aquí -->
        </div>
      </section>
    </main>

    <!-- SCRIPT -->
    <script type="module" src="js/pages/catalogo.js"></script>
  </body>
</html>
